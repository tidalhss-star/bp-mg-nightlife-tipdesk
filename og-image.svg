<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b4513"/>
      <stop offset="100%" stop-color="#a0522d"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#daa520"/>
      <stop offset="100%" stop-color="#a0522d"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Geometric pattern -->
  <circle cx="668" cy="233" r="22" fill="#a0522d" opacity="0.11"/>
    <circle cx="1137" cy="618" r="71" fill="#a0522d" opacity="0.14"/>
    <circle cx="272" cy="48" r="58" fill="#a0522d" opacity="0.13"/>
    <circle cx="769" cy="142" r="24" fill="#a0522d" opacity="0.05"/>
    <circle cx="868" cy="304" r="67" fill="#a0522d" opacity="0.12"/>
    <circle cx="1160" cy="2" r="85" fill="#a0522d" opacity="0.07"/>
    <rect x="490" y="190" width="93" height="45" rx="8" fill="#8b4513" opacity="0.06" transform="rotate(27, 374, 185)"/>
    <rect x="772" y="195" width="64" height="26" rx="8" fill="#8b4513" opacity="0.11" transform="rotate(7, 434, 537)"/>
    <rect x="291" y="97" width="89" height="61" rx="8" fill="#8b4513" opacity="0.06" transform="rotate(6, 424, 511)"/>
    <rect x="66" y="238" width="50" height="33" rx="8" fill="#8b4513" opacity="0.14" transform="rotate(4, 144, 258)"/>
    <rect x="784" y="604" width="60" height="75" rx="8" fill="#8b4513" opacity="0.11" transform="rotate(0, 805, 245)"/>
    <rect x="809" y="-80" width="62" height="71" rx="8" fill="#8b4513" opacity="0.15" transform="rotate(38, 162, 285)"/>
    <rect x="916" y="269" width="50" height="82" rx="8" fill="#8b4513" opacity="0.14" transform="rotate(26, 1283, 438)"/>
    <rect x="934" y="-14" width="67" height="75" rx="8" fill="#8b4513" opacity="0.05" transform="rotate(42, 171, 434)"/>
    <polygon points="219,-18 247,38 191,38" fill="#a0522d" opacity="0.07"/>
    <polygon points="1242,251 1325,417 1159,417" fill="#a0522d" opacity="0.10"/>
    <polygon points="1260,607 1281,649 1239,649" fill="#a0522d" opacity="0.05"/>
    <polygon points="410,171 488,327 332,327" fill="#a0522d" opacity="0.13"/>

  <!-- Wave at bottom -->
  <path d="M0,562 C360,596 840,528 1200,562 L1200,630 L0,630Z" fill="#a0522d" opacity="0.3"/>

  <!-- 중앙 텍스트 카드 -->
  <rect x="80" y="195" width="1040" height="260" rx="20" fill="rgba(0,0,0,0.35)" filter="url(#blur-bg)"/>
  <filter id="blur-bg"><feGaussianBlur stdDeviation="8"/></filter>

  <text x="600" y="270" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="2">
    마포 홍대 로컬 럭셔리 밤문화 가이드
  </text>
  <text x="600" y="330" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.85)">
     — 소셜 밤문화 매개체
  </text>

  <!-- Accent line -->
  <line x1="450" y1="355" x2="750" y2="355" stroke="#daa520" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- 하단 CTA -->
  <rect x="440" y="385" width="320" height="40" rx="20" fill="#daa520" opacity="0.9"/>
  <text x="600" y="411" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="16" font-weight="600" fill="#ffffff">
    ▼ 자세히 보기
  </text>

  <!-- 상단 브랜드 -->
  <text x="60" y="55" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.6)">
     마포 홍대 로컬 럭셔리 밤문화 가이드 — 소셜 밤문화 매개체
  </text>
</svg>